name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/biology-mentor-website-nwh8wr]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Project pages are served from /<repo-name>/, not domain root, so assets
      # need that base path baked in. This does NOT affect the config used for
      # the eventual thebiologymentor.com deploy (that build uses the default
      # base of "/").
      - run: npm run build -- --base=/Biology-Mentor/
      - uses: actions/configure-pages@v5
        with:
          # First run on this repo — no Pages site exists yet, so tell the
          # action to create one (source: GitHub Actions) instead of just
          # looking one up.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
